cursor:
   style:
      shape: Beam
      blinking: Always
      blink-interval: 750

# Ciapre Colors Scheme (https://gogh-co.github.io/Gogh/)
working_directory: ~
# Default colors

colors:
  # Default colors
  primary:
    background: '0x141211'
    foreground: '0xe6d8cb'
  normal:
    black:   '0x2c2a26'
    red:     '0xe68c8c'
    green:   '0x96e68c'
    yellow:  '0xe6c88c'
    blue:    '0x8cbde6'
    magenta: '0xaa8ce6'
    cyan:    '0x8ce6bd'
    white:   '0xe6e68c'
  bright:
    black:   '0x141211'
    red:     '0xe65a5a'
    green:   '0x6fe65a'
    yellow:  '0xe6b55a'
    blue:    '0x5ab5e6'
    magenta: '0x815ae6'
    cyan:    '0x5ae6b5'
    white:   '0xe6e65a'

font:
  normal:
    family: "Liberation Mono"
  size: 16.0
